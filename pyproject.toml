[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────
[project]
name    = "intraday-analyzer"
version = "1.0.0"
description = "Production-grade NSE intraday stock analyzer with real-time alerts, dashboard, and ML modules."
requires-python = ">=3.10"

# Pin to the same versions already in requirements.txt
dependencies = [
    "yfinance==0.2.66",
    "pandas==2.3.3",
    "numpy==2.3.5",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "matplotlib==3.10.8",
    "plotly==6.6.0",
    "streamlit==1.55.0",
    "streamlit-autorefresh==1.0.1",
    "twilio==9.8.8",
    "pymongo==4.15.5",
    "peewee==3.18.3",
    "python-dotenv==1.2.1",
    "pytz==2025.2",
    "dtaidistance==2.3.13",
    "hmmlearn==0.3.3",
    "mplfinance==0.12.10b0",
    "requests==2.32.5",
    "flask==3.1.3",
    "psutil==7.2.2",
]

# ─────────────────────────────────────────────────────────
# Entry points — lets you run `intraday-run` from any directory
# after `pip install -e .`
[project.scripts]
intraday-run       = "Main:run_all_analyzers"
intraday-dashboard = "Dashboard.App:main"

# ─────────────────────────────────────────────────────────
[tool.setuptools]
# Explicit package discovery — excludes the venv (intraday/), Logs/, Signals/
# and the Pairs_Trading sub-project (has its own packaging)

[tool.setuptools.packages.find]
where   = ["."]
include = [
    "Analyzer",
    "Data_Manager*",
    "Dependencies*",
    "Dictionary*",
    "Strategy*",
    "Dashboard*",
]
exclude = [
    "intraday*",
    "Logs*",
    "Signals*",
    "Trail*",
    "Pairs_Trading*",
    "*.egg-info",
    "__pycache__*",
]

# ─────────────────────────────────────────────────────────
[tool.setuptools.package-data]
"*" = ["*.env", "*.txt", "*.json", "*.yaml", "*.cfg"]
